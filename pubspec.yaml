name: shipaton_timer
description: "Nordic minimalist Pomodoro Timer app with gamification, character companions, and RevenueCat monetization for Shipaton 2026."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  just_audio: ^0.9.40
  purchases_flutter: ^10.13.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/items/
    - assets/images/items/foods/
    - assets/images/items/plants/
    - assets/audio/ambient/
    - assets/audio/sfx/

# icon
flutter_launcher_icons:       
  # android: true
  ios: true
  remove_alpha_ios: true 
  image_path: assets/images/app_icon/app_icon.png
